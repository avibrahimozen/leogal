# XcodeGen project specification.
# Generate the Xcode project with:  xcodegen generate
# (brew install xcodegen)
#
# This keeps the project definition in plain text so it lives in git cleanly.
name: Samantha
options:
  bundleIdPrefix: com.samantha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # <- fill in your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

configs:
  Debug: debug
  Release: release

targets:
  Samantha:
    type: application
    platform: iOS
    # Secrets.xcconfig is gitignored; copy Secrets.example.xcconfig to start.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    sources:
      - path: Samantha
    settings:
      base:
        INFOPLIST_FILE: Samantha/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.samantha.app
        # The Anthropic key is injected from Secrets.xcconfig into Info.plist
        # so it is never committed. For production, use a backend proxy instead.
        ENABLE_USER_SCRIPT_SANDBOXING: YES

# A shared scheme so CI (and you) can `xcodebuild -scheme Samantha`.
schemes:
  Samantha:
    build:
      targets:
        Samantha: all
    run:
      config: Debug
    archive:
      config: Release
