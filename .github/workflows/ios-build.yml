name: iOS Build (native)

# Builds the native Swift app (Samantha/) for the iOS Simulator.
# Manual-only: the day-to-day test path is Expo Go (see expo-check.yml).
# Runs on macos-15 (Xcode 16) because XcodeGen emits the newer project format.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create CI Secrets.xcconfig (no real key — build only)
        run: cp Secrets.example.xcconfig Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show build environment
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Samantha.xcodeproj \
            -scheme Samantha \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
