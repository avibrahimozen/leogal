<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Kod Üretici · 7/23 Gece Dönercisi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root {
    --komur: #141210; --is: #1f1b17; --is-2: #2a241e; --koz: #e8871e; --pide: #f3ead9; --kul: #a89f94;
    --display: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
    --body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--komur); color: var(--pide); font-family: var(--body); font-size: 17px; line-height: 1.4; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 28px 18px 48px; display: grid; gap: 18px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; line-height: .95; }
  h1 span { color: var(--koz); display: block; }
  p { margin: 0; color: var(--kul); }
  label { display: grid; gap: 6px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--kul); }
  input {
    font: inherit; font-size: 16px; color: var(--pide); background: var(--is);
    border: 1px solid var(--is-2); border-radius: 6px; padding: 10px 12px; width: 100%;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--koz); outline-offset: 2px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 10px 16px;
    border: 1px solid var(--koz); background: var(--koz); color: var(--komur);
  }
  button.ghost { background: transparent; color: var(--koz); }

  /* Basılacak kart */
  .card {
    background: #fff; color: #141210; border-radius: 10px; padding: 26px 22px 22px;
    display: grid; justify-items: center; gap: 12px; text-align: center;
  }
  .card .t { font-family: var(--display); font-size: 30px; line-height: .95; }
  .card .t span { display: block; color: #b8630f; font-size: 38px; }
  #qr { display: grid; place-items: center; min-height: 240px; }
  #qr img, #qr canvas { width: 240px !important; height: 240px !important; image-rendering: pixelated; }
  .card .s { font-size: 15px; color: #6f675f; }
  .card .tel { font-family: var(--display); font-size: 26px; letter-spacing: .04em; }

  @media print {
    body { background: #fff; }
    .wrap { padding: 0; max-width: none; }
    .no-print { display: none !important; }
    .card { border-radius: 0; page-break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="no-print">
    <h1>QR Menü Kodu <span>7/23 Gece Dönercisi</span></h1>
  </div>
  <p class="no-print">Menünün yayınlandığı adresi girin. Kod anında güncellenir; kartı yazdırıp masalara ve broşürlere koyabilirsiniz.</p>

  <label class="no-print">Menü adresi
    <input id="url" type="url" autocomplete="off" spellcheck="false">
  </label>
  <div class="row no-print">
    <button id="print">Yazdır</button>
    <button id="copy" class="ghost">Adresi kopyala</button>
  </div>

  <div class="card">
    <div class="t">7/23 <span>Gece Dönercisi</span></div>
    <div id="qr" aria-label="QR menü kodu" role="img"></div>
    <div class="s">Menü için okutun · 07:00 – 23:00</div>
    <div class="tel">Alo Paket 0552 990 07 23</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  (function () {
    var input = document.getElementById('url');
    var box = document.getElementById('qr');
    var qr = null;

    // Varsayılan: bu sayfanın yanındaki index.html
    var def = location.href.replace(/qr\.html(\?.*)?(#.*)?$/, '') || location.href;
    input.value = def;

    function draw() {
      var text = input.value.trim();
      box.innerHTML = '';
      if (!text) return;
      qr = new QRCode(box, {
        text: text, width: 480, height: 480,
        colorDark: '#141210', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
    input.addEventListener('input', draw);
    document.getElementById('print').addEventListener('click', function () { window.print(); });
    document.getElementById('copy').addEventListener('click', function () {
      var b = this;
      navigator.clipboard.writeText(input.value).then(function () {
        b.textContent = 'Kopyalandı'; setTimeout(function () { b.textContent = 'Adresi kopyala'; }, 1500);
      });
    });
    draw();
  })();
</script>
</body>
</html>
